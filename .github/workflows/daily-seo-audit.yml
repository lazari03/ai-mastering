name: Daily SEO audit

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install SEO audit dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Crawl public sitemap and pages
        run: python frontend/scripts/seo_inventory.py https://auralithforge.app seo-daily.json
      - name: Validate pages, links, images, metadata and photo credits
        run: python frontend/scripts/seo_daily_check.py seo-daily.json seo-report.json "$GITHUB_STEP_SUMMARY"
      - name: Check ChatGPT/MCP endpoints are not blocked by Cloudflare
        if: always()
        run: python frontend/scripts/mcp_reachability.py "$GITHUB_STEP_SUMMARY"
      - name: Upload crawl inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # seo-report.json is the source of truth the scheduled daily SEO
          # report reads, instead of re-crawling the site in a browser.
          name: seo-inventory
          path: |
            seo-daily.json
            seo-report.json
          if-no-files-found: ignore
          retention-days: 14
