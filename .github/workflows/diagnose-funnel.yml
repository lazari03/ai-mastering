name: Diagnose signup funnel

# Manual, one-off, read-only — aggregate counts only, no PII. Answers "why
# aren't visitors registering" from the real SQLite analytics data instead
# of a guess. Deleted once its job is done.
on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Print funnel numbers on VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH and diagnose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull
            make diagnose-funnel
