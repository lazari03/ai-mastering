name: Diagnose traffic quality (one-off)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Read-only bot-vs-real traffic check
    runs-on: ubuntu-latest
    steps:
      - name: SSH and run diagnostic
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull
            make diagnose-traffic-quality
